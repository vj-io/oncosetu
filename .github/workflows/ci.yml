# CI gates (PRD §10.2 and §12): typecheck, lint, unit tests, dependency audit, secret scan, SAST on every push and PR.
# The database suites (integration, E2E) need a database: they run only when the repository secret CI_ENV_FILE exists
# (skipped otherwise, e.g. on forks), E2E only when started by hand. CI_ENV_FILE holds a whole env file
# (the variables of docs/HANDOFF.md §2) for a DEDICATED CI Neon branch — never production: the suites write and erase data.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the Playwright E2E suite (needs CI_ENV_FILE)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  audit:
    name: npm audit (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm audit --audit-level=high
      # ASVS 14.2.5: a software bill of materials (CycloneDX, runtime dependencies) for every run
      - run: npm sbom --sbom-format cyclonedx --package-lock-only --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # every commit, not just the tip
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan
        # Reviewed false positives are listed by fingerprint in .gitleaksignore. A scan that reads no history also
        # says "no leaks found", so the step fails unless gitleaks reports a non-zero commit count.
        run: |
          set -euo pipefail
          ./gitleaks git --redact --no-banner --exit-code 1 . 2>&1 | tee gitleaks.log
          grep -Eq '[1-9][0-9]* commits scanned' gitleaks.log

  semgrep:
    name: SAST (Semgrep OWASP Top 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: semgrep scan --config p/owasp-top-ten --error --metrics off

  database-secret:
    name: Is a CI database configured?
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        run: echo "present=${{ secrets.CI_ENV_FILE != '' }}" >> "$GITHUB_OUTPUT"

  integration:
    name: Integration tests (live database)
    needs: [checks, database-secret]
    if: needs.database-secret.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-database # one run at a time against the shared CI database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write the env file
        run: printf '%s\n' "$CI_ENV_FILE" > .env.local
        env:
          CI_ENV_FILE: ${{ secrets.CI_ENV_FILE }}
      - run: npx tsx --env-file=.env.local scripts/migrate.ts
      - run: npx tsx --env-file=.env.local scripts/check-migrations.mts
      - run: npm run build # tests/integration/log-redaction.test.ts starts the production server
      - run: npm run test:integration

  e2e:
    name: Playwright E2E (Chromium + WebKit)
    needs: [integration, database-secret]
    if: github.event_name == 'workflow_dispatch' && inputs.e2e && needs.database-secret.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ci-database
      cancel-in-progress: false
    env:
      BASE_URL: http://localhost:3100
      PUBLIC_BASE_URL: http://localhost:3100
      INBOUND_MEDIA_TEST_HOSTS: 127.0.0.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Write the env file
        run: printf '%s\n' "$CI_ENV_FILE" > .env.local
        env:
          CI_ENV_FILE: ${{ secrets.CI_ENV_FILE }}
      - run: npx tsx --env-file=.env.local scripts/migrate.ts
      - run: npm run build
      - name: Start the production server
        run: |
          nohup npx next start -p 3100 > server.log 2>&1 &
          curl --retry 60 --retry-connrefused --retry-delay 1 -sSf -o /dev/null http://localhost:3100/login
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            server.log
          retention-days: 7
